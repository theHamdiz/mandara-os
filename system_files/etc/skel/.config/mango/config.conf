# Mandara OS defaults for MangoWM. Each account starts with a copy in
# ~/.config/mango/config.conf; change that one. Mandara's own binds, rules
# and colours come from the drop-in sourced on the last line, which Mandara
# Studio writes (a bind here wins over Mandara's for the same keys).

# --- Effects (scenefx) ---
blur=1
blur_optimized=1
shadows=1
border_radius=12

# --- Cursor ---
env=XCURSOR_THEME,Bibata-Modern-Classic
env=XCURSOR_SIZE,24
cursor_size=24

# --- Autostart ---
exec_once=mandara

# --- Apps ---
bind=SUPER,Return,spawn,ghostty
bind=SUPER,e,spawn,nautilus
bind=SUPER+SHIFT,e,spawn,ghostty -e yazi
bind=SUPER,b,spawn,helium

# --- Mandara ---
bind=SUPER,space,spawn,mandara msg launcher toggle
bind=SUPER,l,spawn,mandara msg lock
bind=NONE,XF86AudioRaiseVolume,spawn,mandara msg audio volume up
bind=NONE,XF86AudioLowerVolume,spawn,mandara msg audio volume down
bind=NONE,XF86AudioMute,spawn,mandara msg audio mute-all toggle
bind=NONE,XF86AudioMicMute,spawn,mandara msg audio mic mute
bind=NONE,XF86MonBrightnessUp,spawn,mandara msg brightness up
bind=NONE,XF86MonBrightnessDown,spawn,mandara msg brightness down
bind=NONE,XF86AudioPlay,spawn,mandara msg media play-pause
bind=NONE,XF86AudioNext,spawn,mandara msg media next
bind=NONE,XF86AudioPrev,spawn,mandara msg media previous

# --- Windows ---
bind=SUPER,q,killclient,
bind=SUPER,r,reload_config
bind=SUPER+SHIFT,q,quit
bind=SUPER,f,togglefullscreen,
bind=SUPER,v,togglefloating,
bind=SUPER,m,togglemaximizescreen,
bind=SUPER,n,switch_layout
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# --- Tags ---
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Mandara's drop-in (keep this line last).
source_optional=~/.config/mandara/generated/mango.conf
