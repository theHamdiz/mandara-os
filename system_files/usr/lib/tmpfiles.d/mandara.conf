# Mandara's self-updatable copy: /usr/bin/mandara seeds it from
# /usr/lib/mandara/mandara-bin, and Studio -> About -> Update now patches it
# in place, without root, for anyone in the wheel group.
d /var/lib/mandara 0755 root root -
d /var/lib/mandara/bin 2775 root wheel -
# Mandara Login: its state (last user and session) and the shared folder
# sessions copy each person's wallpaper into.
d /var/lib/mandara-greeter 0750 greetd greetd -
d /var/lib/mandara-login/wallpapers 1777 root root -
# Helium lives under /usr; /opt is /var/opt on this system.
L /var/opt/helium - - - - /usr/lib/helium
