<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Resolve remaining UI defaults after user preferences, before Fedora
       expands generic script aliases. Explicit families stay unchanged. -->
  <match target="pattern">
    <test name="family" qual="first" compare="eq">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Alexandria</string>
      <string>Cairo</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first" compare="eq">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Alexandria</string>
      <string>Cairo</string>
    </edit>
  </match>
</fontconfig>
