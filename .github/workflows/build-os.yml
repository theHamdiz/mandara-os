# Builds the Mandara OS image around a Mandara release, for x86_64 and
# aarch64 on native runners, and publishes one multi-arch image:
#   ghcr.io/thehamdiz/mandara-os:<mandara version> and :latest
#
# The only trigger is Mandara's own release pipeline
# (theHamdiz/mandara, .github/workflows/mandara-os.yml), which sends a
# `mandara-shell-updated` repository_dispatch carrying the version once that
# release is published. Nothing here builds on its own.
name: Build OS image

on:
  repository_dispatch:
    types: [mandara-shell-updated]

permissions:
  contents: read

concurrency:
  group: build-os
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/thehamdiz/mandara-os
  FEDORA_VERSION: "45"

jobs:
  version:
    name: Mandara version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check the release
        id: check
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::client_payload.version must be a Mandara version like 0.28.0 (got '$VERSION')"
            exit 1
          fi
          # The release and its checksums must already be published.
          curl -fsSIL -o /dev/null "https://github.com/theHamdiz/mandara/releases/download/v$version/SHA256SUMS"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Mandara OS around Mandara $version" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            base: ghcr.io/ublue-os/base-main
          - arch: arm64
            runner: ubuntu-24.04-arm
            base: quay.io/fedora/fedora-bootc
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
      BASE: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install podman
        run: command -v podman >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq podman; }

      - name: Build
        run: |
          set -euo pipefail
          podman build \
            --platform "linux/$ARCH" \
            --cap-add=SYS_ADMIN \
            --build-arg "BASE_IMAGE=$BASE:$FEDORA_VERSION" \
            --build-arg "FEDORA_VERSION=$FEDORA_VERSION" \
            --build-arg "MANDARA_VERSION=$VERSION" \
            --label "org.opencontainers.image.title=Mandara OS" \
            --label "org.opencontainers.image.description=A bootable Fedora image built around Mandara Shell and MangoWM" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.licenses=GPL-3.0-or-later" \
            --label "containers.bootc=1" \
            --tag "$IMAGE:$VERSION-$ARCH" \
            .

      - name: Push
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push --retry 3 "$IMAGE:$VERSION-$ARCH"

  publish:
    name: Publish multi-arch image
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install podman
        run: command -v podman >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq podman; }

      - name: Manifest
        id: manifest
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman manifest create mandara-os
          podman manifest add mandara-os "docker://$IMAGE:$VERSION-amd64"
          podman manifest add mandara-os "docker://$IMAGE:$VERSION-arm64"
          podman manifest push --all --digestfile digest mandara-os "docker://$IMAGE:$VERSION"
          podman manifest push --all mandara-os "docker://$IMAGE:latest"
          echo "digest=$(cat digest)" >> "$GITHUB_OUTPUT"
          echo "Published \`$IMAGE:$VERSION\` and \`:latest\` ($(cat digest))" >> "$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::warning::COSIGN_PRIVATE_KEY is not set, so the image is not signed."
            exit 0
          fi
          echo "$REGISTRY_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"
