<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Mandara OS: Inter for Latin, Alexandria and Cairo for Arabic,
     JetBrains Mono for code. -->
<fontconfig>
  <dir>/usr/share/fonts/mandara</dir>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer>
      <family>Inter Variable</family>
      <family>Inter</family>
      <family>Alexandria</family>
      <family>Cairo</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Inter Variable</family>
      <family>Inter</family>
      <family>Alexandria</family>
      <family>Cairo</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Alexandria</family>
    </prefer>
  </alias>
</fontconfig>
