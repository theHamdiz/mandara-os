# greetd owns VT1 for Mandara Login. Keep a text getty off that VT so the
# splash-to-login handoff never flashes a login prompt, and send the
# daemon's own stdout/stderr to the journal (session children already go
# through systemd-cat in greetd's config and the mango.desktop Exec).
[Unit]
Conflicts=getty@tty1.service
After=getty@tty1.service

[Service]
StandardOutput=journal
StandardError=journal
